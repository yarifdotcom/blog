<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memuat…</title>
  <script>
    /* Mode terang/gelap sebelum render (mencegah kedipan). Lihat core/color-mode.js */
    try { var m = localStorage.getItem('simpleblog.colorMode');
      if (m !== 'light' && m !== 'dark') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = m; document.documentElement.style.colorScheme = m; } catch (e) {}
  </script>
  <meta name="description" content="">
  <meta name="keywords" content="">
  <meta name="author" content="">
  <meta property="og:type" content="website">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:,">
  <style>
    /* Gaya minimal sebelum tema dimuat */
    .sb-boot { font: 15px/1.6 system-ui, sans-serif; max-width: 560px; margin: 15vh auto; padding: 0 16px; color: #444; text-align: center; }
    .sb-boot h1 { font-size: 1.3rem; color: #222; }
    .sb-boot code { background: #f1f1f1; padding: 2px 6px; border-radius: 4px; }
    .sb-spinner { width: 28px; height: 28px; border: 3px solid #ddd; border-top-color: #555; border-radius: 50%; margin: 0 auto 12px; animation: sb-spin .8s linear infinite; }
    @keyframes sb-spin { to { transform: rotate(360deg); } }
    html[data-theme="dark"] body { background: #121619; }
    html[data-theme="dark"] .sb-boot { color: #aab3bb; }
    html[data-theme="dark"] .sb-boot h1 { color: #e6e8ea; }
    html[data-theme="dark"] .sb-boot code { background: #232a30; }
  </style>
  <style id="custom-css"></style>
</head>
<body>
  <div id="app"><div class="sb-boot"><div class="sb-spinner"></div>Memuat…</div></div>
  <script type="module" src="assets/js/public.js"></script>
</body>
</html>
